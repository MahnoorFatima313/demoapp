<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768" role="img" aria-labelledby="title description">
  <title id="title">Illustrative API request flow</title>
  <desc id="description">A client request passes through an API boundary, application rules and data access to connected systems. Monitoring records relevant events. The controls required depend on the project.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1A365D"/></marker></defs>
  <rect width="1408" height="768" rx="24" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif" fill="#1A365D">
    <text x="56" y="82" font-size="38" font-weight="700">Illustrative API Request Flow</text>
    <text x="56" y="127" font-size="22">Define the contract, access decisions and failure handling before implementation.</text>
    <g stroke="#1A365D" stroke-width="3">
      <rect x="52" y="244" width="180" height="210" rx="18" fill="#EBF8FF"/>
      <rect x="298" y="220" width="250" height="260" rx="18" fill="#EDB702"/>
      <rect x="614" y="220" width="250" height="260" rx="18" fill="#EBF8FF"/>
      <rect x="930" y="220" width="250" height="260" rx="18" fill="#EBF8FF"/>
      <rect x="1246" y="244" width="110" height="210" rx="18" fill="#2B6CB0"/>
    </g>
    <g font-size="24" font-weight="700" text-anchor="middle">
      <text x="142" y="300">Client</text>
      <text x="423" y="276">API Boundary</text>
      <text x="739" y="276">Application</text>
      <text x="1055" y="276">Data Access</text>
      <g fill="#FFFFFF"><text x="1301" y="308" font-size="20">Data &amp;</text><text x="1301" y="338" font-size="20">Services</text></g>
    </g>
    <g font-size="20" text-anchor="middle">
      <text x="142" y="352">Web, mobile</text><text x="142" y="384">or another system</text>
      <text x="423" y="328">Authentication</text><text x="423" y="366">Input validation</text><text x="423" y="404">Configured limits</text>
      <text x="739" y="328">Authorization</text><text x="739" y="366">Business rules</text><text x="739" y="404">Error handling</text>
      <text x="1055" y="328">Queries &amp; transactions</text><text x="1055" y="366">Optional caching</text><text x="1055" y="404">External API calls</text>
    </g>
    <g stroke="#1A365D" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M232 350H286"/><path d="M548 350H602"/><path d="M864 350H918"/><path d="M1180 350H1234"/>
      <path d="M739 480V544"/>
    </g>
    <rect x="474" y="560" width="530" height="78" rx="16" fill="#1A365D"/>
    <text x="739" y="607" text-anchor="middle" font-size="23" fill="#FFFFFF">Monitoring, logs and operational alerts</text>
    <text x="56" y="708" font-size="20">An example architecture, not a client benchmark. Choose controls for the actual data, workload and integrations.</text>
  </g>
</svg>
